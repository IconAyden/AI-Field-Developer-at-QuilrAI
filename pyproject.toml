[project]
name = "ai-solutions-engineer-assessment"
version = "1.0.0"
description = "Four take-home tasks: MCP server, MCP security gateway, LLM streaming PII guardrail, rate-limiting model router"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20",
    "pydantic>=2.7",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[tool.pytest.ini_options]
testpaths = ["task1_mcp_server/tests", "task2_mcp_gateway/tests", "task3_llm_streaming_guardrail/tests", "task4_model_router/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
